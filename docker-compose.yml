# Production-style stack. For local development, docker-compose.override.yml is
# merged automatically by `docker compose up` (DEBUG, live code reload, local
# Postgres port). Run production without it:
#   docker compose -f docker-compose.yml up -d --build
services:
  db:
    image: postgres:15
    container_name: ai-receptionist-db
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_receptionist}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: only the web service can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: ai-receptionist-web
    env_file:
      - .env
    environment:
      DEBUG: "False"   # production stack; the dev override turns it back on
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./google-calendar-credentials.json:/app/google-calendar-credentials.json:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
